name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: genvm-lint check contracts/terms_watch.py
      - run: pytest tests/direct/ -v
      - name: Direct tests against the deployed (shrunk) code
        run: |
          python deploy/shrink.py contracts/terms_watch.py /tmp/terms_watch.py --pack
          cp /tmp/terms_watch.py contracts/terms_watch.py
          pytest tests/direct/ -q
      - name: App controls per watch form state
        run: node app/check-actions.mjs app/index.html
